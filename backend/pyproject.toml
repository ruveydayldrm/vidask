[project]
name = "vidask"
version = "0.1.0"
description = "Ask questions about any YouTube video — answers with verified, clickable timestamps. Fully local."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "structlog>=24.4",
    "youtube-transcript-api>=1.0",
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1",
    "sentence-transformers>=3.3",
    "qdrant-client>=1.12",
    "rank-bm25>=0.2.2",
    "redis>=5.2",
    "rq>=2.0",
]

[project.optional-dependencies]
vision = [
    "scenedetect[opencv-headless]>=0.6.5",
    "easyocr>=1.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
